name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Exit code 5 is "no tests collected" — expected until the first test
      # lands. Drop the guard once tests/ has something in it.
      - run: pytest -q || [ $? -eq 5 ]
